name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: intel
          POSTGRES_PASSWORD: intel
          POSTGRES_DB: intel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intel -d intel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      INTEL_DATABASE_URL: postgresql+psycopg://intel:intel@localhost:5432/intel

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync deps
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Check Alembic metadata drift
        run: uv run alembic check

      - name: Offline + database integration tests
        run: uv run pytest -m "not live" -v

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync deps
        run: uv sync --frozen

      - name: Static checks
        run: uv run ruff check . && uv run pyright

      - name: DB-free tests
        run: uv run pytest -m "not live and not db" -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Install deps
        run: npm --prefix web-src ci

      - name: Typecheck
        run: npm --prefix web-src run typecheck

      - name: Build
        run: npm --prefix web-src run build
