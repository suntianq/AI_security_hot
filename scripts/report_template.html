<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI × Security 热点</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f5;--card:#fff;--line:#e8e8e8;--hover:#f0f4ff;
  --fg:#1a1a1a;--mut:#888;--acc:#2563eb;--acc2:#1e40af;
  --c1:#ef4444;--c2:#f59e0b;--c3:#10b981;--c4:#8b5cf6;--c5:#06b6d4;--c6:#f97316;
  --radius:10px;
}
body{background:var(--bg);color:var(--fg);
  font:15px/1.6 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 0;
  position:sticky;top:0;z-index:100}
.header-inner{max-width:960px;margin:0 auto;padding:0 20px;display:flex;
  align-items:center;justify-content:space-between}
header h1{font-size:20px;font-weight:700;letter-spacing:-.5px}
header h1 span{color:var(--mut);font-weight:400;font-size:14px;margin-left:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;
  color:var(--mut);border:1px solid transparent;transition:all .15s}
.tab:hover{color:var(--fg);background:var(--hover)}
.tab.active{color:var(--acc);border-color:var(--acc);background:rgba(37,99,235,.06)}
.wrap{max-width:960px;margin:0 auto;padding:20px}

/* Hot ranking */
.hot-section{margin-bottom:28px}
.hot-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;
  align-items:center;gap:8px}
.hot-title .dot{width:8px;height:8px;border-radius:50%;background:var(--c1);
  animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hot-list{display:grid;gap:8px}
.hot-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  transition:all .15s;cursor:pointer}
.hot-item:hover{border-color:var(--acc);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.hot-rank{font-size:20px;font-weight:800;min-width:28px;text-align:center;
  line-height:1.2}
.hot-rank.r1{color:var(--c1)}.hot-rank.r2{color:var(--c2)}
.hot-rank.r3{color:var(--c3)}.hot-rank.r4,.hot-rank.r5{color:var(--mut)}
.hot-body{flex:1;min-width:0}
.hot-title-text{font-weight:600;font-size:14px;margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hot-summary{font-size:13px;color:var(--mut);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hot-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.hot-score{font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;
  background:var(--c2);color:#fff}
.hot-score.s70{background:var(--c1)}
.hot-score.s50{background:var(--c2)}
.hot-score.s0{background:var(--mut)}

/* Timeline */
.date-group{margin-bottom:24px}
.date-header{font-size:15px;font-weight:700;color:var(--fg);margin-bottom:10px;
  padding-bottom:6px;border-bottom:2px solid var(--line)}
.date-header .weekday{color:var(--mut);font-weight:400;font-size:13px;margin-left:6px}
.date-header .count{color:var(--mut);font-size:12px;margin-left:8px}

.news-card{background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 18px;margin-bottom:8px;
  transition:all .15s}
.news-card:hover{border-color:var(--acc);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.news-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.news-time{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.news-source{font-size:12px;color:var(--acc);font-weight:500}
.news-dup{font-size:11px;color:var(--mut);background:var(--bg);
  padding:1px 6px;border-radius:4px}
.news-title{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:6px}
.news-title a:hover{color:var(--acc)}
.news-summary{font-size:13px;color:#555;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:12px;border:1px solid;white-space:nowrap}
.tag.cve{color:var(--c1);border-color:var(--c1);background:rgba(239,68,68,.06)}
.tag.llm{color:var(--c5);border-color:var(--c5);background:rgba(6,182,212,.06)}
.tag.ai_for_security{color:var(--c3);border-color:var(--c3);background:rgba(16,185,129,.06)}
.tag.security_for_ai{color:var(--c2);border-color:var(--c2);background:rgba(245,158,11,.06)}
.tag.agent{color:var(--c4);border-color:var(--c4);background:rgba(139,92,246,.06)}
.tag.system_security{color:var(--c6);border-color:var(--c6);background:rgba(249,115,22,.06)}
.tag.co{color:var(--mut);border-color:var(--line);background:var(--bg)}
.tag.et{color:var(--acc);border-color:var(--acc);background:rgba(37,99,235,.06)}

/* Stats (collapsed) */
.stats-section{margin-top:32px;border-top:2px solid var(--line);padding-top:20px}
.stats-toggle{font-size:14px;font-weight:600;color:var(--mut);cursor:pointer;
  user-select:none;display:flex;align-items:center;gap:6px}
.stats-toggle:hover{color:var(--acc)}
.stats-content{display:none;margin-top:14px}
.stats-content.show{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .n{font-size:22px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--mut);font-size:11px;margin-top:2px}
.bar-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.bar-row .name{width:120px;font-size:12px;flex-shrink:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.bar-row .track{flex:1;background:#f0f0f0;border-radius:4px;height:16px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:4px}
.bar-row .v{width:50px;text-align:right;font-size:11px;color:var(--mut);flex-shrink:0}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:760px){.stat-grid{grid-template-columns:1fr}}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat-card h4{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:8px}

footer{text-align:center;padding:20px;color:var(--mut);font-size:12px}

/* --- report v2 additions --- */
.searchbar{display:flex;gap:8px;margin-bottom:16px}
.searchbar input{flex:1;padding:8px 14px;border:1px solid var(--line);border-radius:20px;
  font-size:14px;outline:none;background:var(--card)}
.searchbar input:focus{border-color:var(--acc)}
.day-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.day-tab{padding:4px 12px;border-radius:14px;font-size:12px;cursor:pointer;
  color:var(--mut);border:1px solid var(--line);background:var(--card)}
.day-tab.active{color:var(--acc);border-color:var(--acc);background:rgba(37,99,235,.06)}
.src-badge{font-size:11px;font-weight:600;padding:1px 8px;border-radius:6px;
  background:var(--c3);color:#fff}
.src-badge.multi{background:var(--c1)}
.hot-evidence{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.hot-evidence .ev-doc{font-size:12px;color:var(--mut);padding:2px 0;display:flex;gap:6px;
  align-items:baseline}
.hot-evidence .ev-doc a{color:var(--acc);text-decoration:none;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hot-evidence .ev-doc a:hover{text-decoration:underline}
.ev-level{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:4px;
  padding:0 4px;flex-shrink:0}
.noise-flag{font-size:10px;color:var(--mut);background:var(--bg);padding:0 6px;
  border-radius:4px}
.cve-block{margin-top:28px}
.cve-item{display:flex;gap:10px;padding:8px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:8px;margin-bottom:6px;align-items:center}
.cve-item .cve-id{font-family:ui-monospace,monospace;font-size:12px;font-weight:600;
  color:var(--c1);flex-shrink:0;min-width:130px}
.cve-item .cve-title{flex:1;font-size:13px;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cve-item .cve-meta{font-size:11px;color:var(--mut);flex-shrink:0}
.health-row{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
.health-row .hname{width:180px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.health-row .hstatus{font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600}
.hstatus.circuit_open{background:rgba(239,68,68,.1);color:var(--c1)}
.hstatus.active{background:rgba(16,185,129,.1);color:var(--c3)}
.hstatus.paused{background:rgba(245,158,11,.1);color:var(--c2)}
.hstatus.retired{background:var(--bg);color:var(--mut)}
.hfail{font-size:11px;color:var(--c1);flex-shrink:0}
.hot-search-highlight{background:#fff3bf;border-radius:2px}
.cve-toggle{cursor:pointer}
mark{background:#fff3bf;padding:0 1px;border-radius:2px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>AI × Security 热点<span id="dateLabel"></span></h1>
    <div class="tabs" id="tabs"></div>
  </div>
</header>
<div class="wrap">
  <div class="searchbar">
    <input id="searchInput" type="text" placeholder="搜索标题 / 摘要 / 来源 / CVE…" />
  </div>
  <div class="hot-section">
    <div class="hot-title"><span class="dot"></span>热点速览</div>
    <div class="day-tabs" id="hotDayTabs"></div>
    <div class="hot-list" id="hotList"></div>
  </div>
  <div class="hot-section cve-block" id="cveSection">
    <div class="hot-title" style="color:var(--c1)">最近 CVE 焦点</div>
    <div id="cveList"></div>
  </div>
  <div class="hot-section">
    <div class="hot-title">新闻时间线</div>
    <div class="day-tabs" id="timelineDayTabs"></div>
    <div id="timeline"></div>
  </div>
  <div class="stats-section">
    <div class="stats-toggle" id="statsToggle">▸ 数据统计 / 运行状态</div>
    <div class="stats-content" id="statsContent"></div>
  </div>
</div>
<footer id="footer"></footer>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const L = D.labels;
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num = n => (n??0).toLocaleString('en-US');

// ---- Time helpers (Asia/Shanghai natural day) ----
const WEEKDAYS = ['日','一','二','三','四','五','六'];
function shanghaiDate(iso){
  const d = new Date(iso);
  // Convert to Asia/Shanghai wall time (UTC+8, no DST)
  return new Date(d.getTime() + 8*3600*1000);
}
function dayKey(iso){
  if(!iso) return '';
  const d = shanghaiDate(iso);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function dateLabel(iso){
  if(!iso) return '';
  const d = shanghaiDate(iso);
  return `${d.getUTCMonth()+1}月${d.getUTCDate()}日`;
}
function weekdayLabel(iso){
  if(!iso) return '';
  const d = shanghaiDate(iso);
  return `周${WEEKDAYS[d.getUTCDay()]}`;
}
function fmtTime(iso){return iso?iso.substring(11,16):''}
function fmtDate(iso){return iso?iso.substring(0,10):''}

// ---- Date range filter ----
const DAY_RANGES = [
  {id:'today', label:'今天'},
  {id:'yesterday', label:'昨天'},
  {id:'week', label:'近7天'},
  {id:'all', label:'全部'},
];
function rangeFilter(range, iso){
  if(range==='all' || !iso) return true;
  const now = new Date();
  const today = dayKey(now.toISOString());
  const day = dayKey(iso);
  if(range==='today') return day===today;
  if(range==='yesterday'){
    const y = shanghaiDate(now.toISOString()); y.setUTCDate(y.getUTCDate()-1);
    const yk = `${y.getUTCFullYear()}-${String(y.getUTCMonth()+1).padStart(2,'0')}-${String(y.getUTCDate()).padStart(2,'0')}`;
    return day===yk;
  }
  if(range==='week'){
    const w = shanghaiDate(now.toISOString()); w.setUTCDate(w.getUTCDate()-7);
    const wk = `${w.getUTCFullYear()}-${String(w.getUTCMonth()+1).padStart(2,'0')}-${String(w.getUTCDate()).padStart(2,'0')}`;
    return day>=wk;
  }
  return true;
}
function renderDayTabs(elId, range, setRange){
  $(elId).innerHTML = DAY_RANGES.map(r=>
    `<div class="day-tab${r.id===range?' active':''}" data-range="${r.id}">${r.label}</div>`
  ).join('');
  $(elId).querySelectorAll('.day-tab').forEach(el=>{
    el.onclick = ()=>{ setRange(el.dataset.range); };
  });
}

// ---- State ----
let activeTech = '';
let hotRange = 'week';
let timelineRange = 'week';
let searchTerm = '';

// ---- Tabs (tech topics) ----
const ALL_TECHS = ['llm','ai_for_security','security_for_ai','agent','system_security'];
const tabs = [{id:'',label:'全部'},...ALL_TECHS.map(t=>({id:t,label:L.tech[t]||t}))];
$('tabs').innerHTML = tabs.map(t=>`<div class="tab${t.id?'':' active'}" data-tech="${t.id}">${esc(t.label)}</div>`).join('');
document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{
  activeTech = el.dataset.tech;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===el));
  renderTimeline(); renderHot();
});

// ---- Date header ----
const genDate = shanghaiDate(D.generated_at);
$('dateLabel').textContent = `${genDate.getUTCMonth()+1}月${genDate.getUTCDate()}日`;

// ---- Search ----
$('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value.trim().toLowerCase();
  renderTimeline();
});

// ---- Hot ranking ----
function renderHot(){
  const events = (D.events||[]).filter(e=>{
    if(!activeTech) return true;
    return e.topic===activeTech;
  }).filter(e=>!e.noise).filter(e=>rangeFilter(hotRange, e.last));
  const top = events.slice(0,10);
  $('hotList').innerHTML = top.map((e,i)=>{
    const sc = e.score ?? 0;
    const cls = sc>=70?'s70':sc>=50?'s50':'s0';
    const rankCls = `r${Math.min(i+1,5)}`;
    const srcBadge = (e.source_count||0)>=2
      ? `<span class="src-badge multi">${e.source_count}源印证</span>`
      : `<span class="src-badge">${e.source_count||1}源</span>`;
    const evs = e.evidence||[];
    const evHtml = evs.length ? `
      <div class="hot-evidence">
        ${evs.slice(0,5).map(d=>`<div class="ev-doc">
          ${d.level?`<span class="ev-level">${esc(d.level)}</span>`:''}
          <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a>
        </div>`).join('')}
        ${evs.length>5?`<div class="ev-doc" style="color:var(--mut)">… 共 ${evs.length} 条证据</div>`:''}
      </div>` : '';
    return `<div class="hot-item">
      <div class="hot-rank ${rankCls}">${i+1}</div>
      <div class="hot-body">
        <div class="hot-title-text">${esc(e.title)}</div>
        ${e.summary?`<div class="hot-summary">${esc(e.summary)}</div>`:''}
        <div class="hot-meta">
          <span class="hot-score ${cls}">${sc}分</span>
          ${srcBadge}
          ${e.topic?`<span class="tag ${e.topic}">${esc(L.tech[e.topic]||e.topic)}</span>`:''}
          ${e.type?`<span class="tag et">${esc(L.etype[e.type]||e.type)}</span>`:''}
          <span style="font-size:11px;color:var(--mut)">${dateLabel(e.last)}</span>
        </div>
        ${evHtml}
      </div>
    </div>`;
  }).join('') || '<div style="color:var(--mut);padding:20px">该范围暂无热点事件</div>';
}

// ---- CVE focus ----
function renderCve(){
  const items = D.cve_focus||[];
  $('cveList').innerHTML = items.slice(0,15).map(c=>`
    <div class="cve-item">
      <span class="cve-id">${esc(c.cve||'N/A')}</span>
      <span class="cve-title" title="${esc(c.title)}">${esc(c.title)}</span>
      <span class="cve-meta">${c.score?`${c.score}分 · `:''}${c.docs}篇 · ${dateLabel(c.last)}</span>
    </div>`).join('') || '<div style="color:var(--mut);padding:12px">最近无 CVE 焦点</div>';
}

// ---- Timeline ----
function highlight(text){
  if(!searchTerm) return esc(text);
  const escaped = esc(text);
  const lower = escaped.toLowerCase();
  if(!lower.includes(searchTerm)) return escaped;
  const idx = lower.indexOf(searchTerm);
  const term = escaped.substring(idx, idx+searchTerm.length);
  return escaped.substring(0,idx) + '<mark>' + term + '</mark>' + escaped.substring(idx+searchTerm.length);
}
function techTags(arr){return arr.map(x=>`<span class="tag ${x}">${esc(L.tech[x]||x)}</span>`).join('')}
function coTags(arr){return arr.slice(0,3).map(x=>`<span class="tag co">${esc(x)}</span>`).join('')}

function renderTimeline(){
  const docs = (D.docs||[]).filter(d=>{
    if(activeTech && !d.tech.includes(activeTech)) return false;
    if(!rangeFilter(timelineRange, d.pub)) return false;
    if(searchTerm){
      const hay = `${d.title} ${d.summary||''} ${L.source[d.source]||d.source} ${(d.cve||[]).join(' ')}`.toLowerCase();
      if(!hay.includes(searchTerm)) return false;
    }
    return true;
  });
  const groups = {};
  docs.forEach(d=>{
    const dt = fmtDate(d.pub);
    if(!groups[dt]) groups[dt] = [];
    groups[dt].push(d);
  });
  const sortedDates = Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  $('timeline').innerHTML = sortedDates.map(dt=>{
    const items = groups[dt];
    return `<div class="date-group">
      <div class="date-header">${dateLabel(dt)} <span class="weekday">${weekdayLabel(dt)}</span>
        <span class="count">${items.length}条</span></div>
      ${items.map(d=>`
        <div class="news-card">
          <div class="news-meta">
            <span class="news-time">${esc(fmtTime(d.pub))}</span>
            <span class="news-source">${esc(L.source[d.source]||d.source)}</span>
            ${d.dup?'<span class="news-dup">重复</span>':''}
            ${d.cve&&d.cve.length?`<span class="tag cve">${esc(d.cve.join(' '))}</span>`:''}
          </div>
          <div class="news-title"><a href="${esc(d.url)}" target="_blank" rel="noopener">${highlight(d.title)}</a></div>
          ${d.summary?`<div class="news-summary">${highlight(d.summary)}</div>`:''}
          <div class="news-tags">${techTags(d.tech)}${coTags(d.company)}${d.etype?`<span class="tag et">${esc(L.etype[d.etype]||d.etype)}</span>`:''}</div>
        </div>`).join('')}
    </div>`;
  }).join('') || '<div style="color:var(--mut);padding:20px">该筛选条件暂无文档</div>';
}

// ---- Stats (collapsed) ----
const t = D.totals;
function barsHTML(data,labels,colored){
  const entries = Object.entries(data);
  if(!entries.length) return '<div style="color:var(--mut);font-size:12px">无数据</div>';
  const max = Math.max(...entries.map(e=>e[1]),1);
  const colors = {cve:'#ef4444',llm:'#06b6d4',ai_for_security:'#10b981',
    security_for_ai:'#f59e0b',agent:'#8b5cf6',system_security:'#f97316'};
  return entries.map(([k,v])=>{
    const label = (labels&&labels[k])||k;
    const col = colored&&colors[k]?colors[k]:'#2563eb';
    const pct = Math.max(2,Math.round(v/max*100));
    return `<div class="bar-row"><div class="name" title="${esc(k)}">${esc(label)}</div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="v">${num(v)}</div></div>`;
  }).join('');
}
function healthHTML(){
  const h = D.source_health||{};
  const byStatus = h.by_status||{};
  const degraded = h.degraded||[];
  const statusRows = Object.entries(byStatus).map(([k,v])=>{
    const cls = k.replace(/[^a-z]/g,'_')||'active';
    return `<div class="health-row"><span class="hname">${esc(k)}</span>
      <span class="hstatus ${cls}">${k}</span><span style="font-size:12px">${num(v)}</span></div>`;
  }).join('');
  const degRows = degraded.map(ep=>`
    <div class="health-row"><span class="hname">${esc(ep.id)}</span>
      <span class="hstatus ${esc(ep.status)}">${esc(ep.status)}</span>
      ${ep.failures?`<span class="hfail">连续失败 ${ep.failures} 次</span>`:''}</div>`).join('');
  return `<div class="stat-card" style="grid-column:span 2">
    <h4>信源健康</h4>
    ${statusRows||'<div style="font-size:12px;color:var(--mut)">无状态数据</div>'}
    ${degRows?`<div style="margin-top:8px">${degRows}</div>`:''}
    </div>`;
}
function semHTML(){
  const s = D.semantic||{};
  const workStatus = s.work_status||{};
  return `<div class="stat-card" style="grid-column:span 2">
    <h4>语义影子状态</h4>
    <div class="bar-row"><div class="name">已富化</div><div class="track">
      <div class="fill" style="width:${Math.min(100,s.total||0)}%;background:#8b5cf6"></div></div>
      <div class="v">${num(s.total)}</div></div>
    <div class="bar-row"><div class="name">相关</div><div class="track">
      <div class="fill" style="width:${s.total?Math.round((s.relevant||0)/s.total*100):0}%;background:#10b981"></div></div>
      <div class="v">${num(s.relevant)}</div></div>
    <div class="bar-row"><div class="name">原子事件</div><div class="v" style="width:auto">${num(s.atomic_events)}</div></div>
    <div class="bar-row"><div class="name">Claim</div><div class="v" style="width:auto">${num(s.claims)}</div></div>
    <div style="margin-top:6px;font-size:12px;color:var(--mut)">
      工作状态: ${Object.entries(workStatus).map(([k,v])=>`${esc(k)} ${num(v)}`).join(' · ')||'无'}</div>
    <div style="font-size:12px;color:var(--mut);margin-top:4px">
      embedding: ${num(s.embeddings)} (${num(s.embedding_versions)} 版本)</div>
    </div>`;
}

$('statsContent').innerHTML = `
  <div class="kpis">
    ${[
      [num(t.documents_reading),'资讯文档'],
      [num(t.documents_bulk),'漏洞库条目'],
      [num(t.events),'资讯事件'],
      [num(t.cve_events),'漏洞库事件'],
      [num(t.sources),'信息源'],
      [num(t.hotspots),'热点事件'],
    ].map(([n,l])=>`<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}
  </div>
  <div class="stat-grid">
    <div class="stat-card"><h4>信息源分布</h4>
      ${barsHTML(D.sources?Object.fromEntries(D.sources.map(s=>[s.id,s.n])):{},L.source)}</div>
    <div class="stat-card"><h4>技术方向</h4>
      ${barsHTML(D.tech||{},L.tech,true)}</div>
    <div class="stat-card"><h4>内容类型</h4>
      ${barsHTML(D.etype||{},L.etype)}</div>
    <div class="stat-card"><h4>语言</h4>
      ${barsHTML(D.lang||{},{en:'英文',zh:'中文','?':'未知'})}</div>
    ${healthHTML()}
    ${semHTML()}
  </div>`;
$('statsToggle').onclick=()=>{
  const c=$('statsContent');
  c.classList.toggle('show');
  $('statsToggle').textContent = c.classList.contains('show')?'▾ 数据统计 / 运行状态':'▸ 数据统计 / 运行状态';
};

// ---- Init ----
function setHotRange(r){ hotRange=r; renderHot(); renderDayTabs('hotDayTabs', hotRange, setHotRange); }
function setTimelineRange(r){ timelineRange=r; renderTimeline(); renderDayTabs('timelineDayTabs', timelineRange, setTimelineRange); }
renderDayTabs('hotDayTabs', hotRange, setHotRange);
renderDayTabs('timelineDayTabs', timelineRange, setTimelineRange);
renderHot();
renderCve();
renderTimeline();

$('footer').textContent = `${D.generated_at}  ·  ${num(t.documents)} 篇文档  ·  ${num(t.events)} 个事件  ·  ${t.sources} 个信息源`;
</script>
</body>
</html>
